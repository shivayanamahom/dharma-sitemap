name: Build and publish Joomla package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Check
        run: |
          python3 dev/check_languages.py
          php tests/run.php
      - name: Build package
        env:
          DHARMA_SITEMAP_VERSION: ${{ github.ref_name }}
        run: |
          DHARMA_SITEMAP_VERSION="${DHARMA_SITEMAP_VERSION#v}" ./build.sh
          unzip -tqq "dist/pkg_dharmasitemap-${DHARMA_SITEMAP_VERSION#v}.zip"
          sha256sum "dist/pkg_dharmasitemap-${DHARMA_SITEMAP_VERSION#v}.zip" > dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          RELEASE_VERSION="${RELEASE_TAG#v}"
          RELEASE_ARCHIVE="pkg_dharmasitemap-${RELEASE_VERSION}.zip"
          gh release create "$RELEASE_TAG" "dist/$RELEASE_ARCHIVE" dist/SHA256SUMS.txt --title "Dharma Sitemap $RELEASE_VERSION" --generate-notes
      - name: Publish update feed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          RELEASE_VERSION="${RELEASE_TAG#v}"
          RELEASE_ARCHIVE="pkg_dharmasitemap-${RELEASE_VERSION}.zip"
          RELEASE_SHA256="$(awk '{print $1}' dist/SHA256SUMS.txt)"
          git switch main
          git pull --ff-only origin main
          python3 dev/update_feed.py --version "$RELEASE_VERSION" --sha256 "$RELEASE_SHA256" --archive "$RELEASE_ARCHIVE" --tag "$RELEASE_TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates.xml
          git commit -m "Опубликовать ленту обновлений $RELEASE_VERSION"
          git push origin main
