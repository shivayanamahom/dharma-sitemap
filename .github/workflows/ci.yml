name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: PHP syntax
        run: |
          status=0
          while IFS= read -r file; do php -l "$file" > /dev/null || status=1; done < <(git ls-files '*.php')
          exit $status
      - name: XML manifests and settings
        run: |
          sudo apt-get install -y --no-install-recommends libxml2-utils > /dev/null
          git ls-files '*.xml' | xargs xmllint --noout
      - name: Language files
        run: python3 dev/check_languages.py
      - name: Unit tests
        run: php tests/run.php
      - name: Build package
        run: |
          ./build.sh
          unzip -tqq dist/pkg_dharmasitemap-*.zip
          unzip -l dist/pkg_dharmasitemap-*.zip | grep -q com_dharmasitemap.zip
