COM_DHARMASITEMAP_TAB_AUTOMATION="Автоматизация"
COM_DHARMASITEMAP_TAB_PERMISSIONS="Права доступа"
COM_DHARMASITEMAP_SCHEDULER="Расписание генерации"
COM_DHARMASITEMAP_XML_ENDPOINT="Резервный Joomla endpoint"
COM_DHARMASITEMAP_CONFIG_GENERAL="Общие настройки"
COM_DHARMASITEMAP_CONFIG_SOURCES="Источники URL"
COM_DHARMASITEMAP_CONFIG_EXCLUSIONS="Исключения"
COM_DHARMASITEMAP_SETTINGS_GENERAL_DESC="Здесь задаются основной домен в sitemap, очистка рекламных параметров и ограничение размера файлов."
COM_DHARMASITEMAP_SETTINGS_SOURCES_DESC="Отключите источник, если его страницы не должны индексироваться. Плагины могут добавлять собственные источники отдельными настройками."
COM_DHARMASITEMAP_SETTINGS_EXCLUSIONS_DESC="Фильтры применяются после проверки публикации и публичного доступа. Исключение по пути влияет на все источники."
COM_DHARMASITEMAP_AUTOMATION_DESC="Расписание хранится в штатных задачах Joomla. Создайте задачу Dharma Sitemap и задайте нужную периодичность; она использует сохранённые настройки источников и фильтров."
COM_DHARMASITEMAP_CLI_TITLE="Командная строка"
COM_DHARMASITEMAP_CLI_DESC="Включите плагин Dharma Sitemap — CLI в менеджере плагинов, затем запускайте команду из корня Joomla."
COM_DHARMASITEMAP_PLUGINS="Открыть плагины Joomla"
COM_DHARMASITEMAP_PERMISSIONS_DESC="Права задаются стандартной матрицей Joomla для компонента. Доступ к изменению этой матрицы есть только у пользователей с правом управления настройками компонента."
COM_DHARMASITEMAP_SETTINGS_ACCESS_DENIED="У вашей учётной записи нет права изменять настройки этого компонента. Попросите администратора Joomla выдать право «Настройки компонента»."
COM_DHARMASITEMAP_FIELD_EXCLUDE_URLS="Исключённые пути URL"
COM_DHARMASITEMAP_FIELD_EXCLUDE_URLS_DESC="По одному шаблону пути на строку. Поддерживаются * и ?. Например: /search/* или /dharma-shop/tovar-ne-dlya-indeksacii. Шаблон применяется к пути, без домена и query-параметров."
COM_DHARMASITEMAP_FIELD_EXCLUDE_ENTITIES="Исключённые сущности"
COM_DHARMASITEMAP_FIELD_EXCLUDE_ENTITIES_DESC="По одному ключу на строку в формате provider:id. Примеры: joomla.content:123, dharmashop.products:456. Публичный доступ и статус публикации всё равно проверяются отдельно."
COM_DHARMASITEMAP_STATIC_FILE_NOTE="Компонент публикует физический sitemap.xml в корне сайта. Существующий чужой файл не перезаписывается."
COM_DHARMASITEMAP_XML_DESCRIPTION="Генератор расширяемой XML-карты сайта для Joomla и Dharma Shop."
