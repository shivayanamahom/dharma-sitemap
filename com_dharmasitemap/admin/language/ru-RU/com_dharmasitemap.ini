COM_DHARMASITEMAP_FIELD_BASE_URL="Канонический адрес сайта"
COM_DHARMASITEMAP_FIELD_BASE_URL_DESC="Необязательно. Используйте корневой HTTPS-адрес сайта без пути и параметров. Пустое значение использует основной адрес Joomla."
COM_DHARMASITEMAP_FIELD_TRACKING="Параметры для удаления"
COM_DHARMASITEMAP_FIELD_TRACKING_DESC="Параметры, не меняющие содержимое страницы, будут исключены из URL. Разделяйте запятыми или пробелами. Параметры маршрутизации Joomla не удаляются автоматически."
COM_DHARMASITEMAP_FIELD_PART_SIZE="URL в одном файле"
COM_DHARMASITEMAP_FIELD_PART_SIZE_DESC="Количество адресов в части карты. Допустимый диапазон: от 1 000 до 50 000."
COM_DHARMASITEMAP_FIELD_INCLUDE_CONTENT="Материалы и категории Joomla"
