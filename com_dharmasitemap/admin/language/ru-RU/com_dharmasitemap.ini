COM_DHARMASITEMAP_TITLE="Dharma Sitemap"
COM_DHARMASITEMAP_INTRO="Создавайте карту сайта из публичных страниц Joomla и Dharma Shop. Неопубликованные и закрытые страницы пропускаются."
COM_DHARMASITEMAP_GENERATION="Сборка карты сайта"
COM_DHARMASITEMAP_GENERATION_DESC="Новая карта появится только после успешной сборки. Пока она выполняется, посетителям доступна предыдущая версия."
COM_DHARMASITEMAP_BUILD_NOW="Собрать сейчас"
COM_DHARMASITEMAP_LAST_BUILD="Последняя опубликованная сборка"
COM_DHARMASITEMAP_NO_BUILD="Карта ещё не создана. Запустите первую сборку."
COM_DHARMASITEMAP_FIELD_STATUS="Состояние"
COM_DHARMASITEMAP_STATUS_READY="Опубликована"
COM_DHARMASITEMAP_FIELD_FINISHED="Завершена"
COM_DHARMASITEMAP_FIELD_URL_COUNT="Адресов"
COM_DHARMASITEMAP_FIELD_DUPLICATES="Повторных адресов"
COM_DHARMASITEMAP_FIELD_ENDPOINT="Карта сайта"
COM_DHARMASITEMAP_BUILD_SUCCESS="Карта опубликована: адресов %s, повторов %s."
COM_DHARMASITEMAP_BUILD_FAILED="Сборка не опубликована: %s"
COM_DHARMASITEMAP_FIELD_BASE_URL="Канонический адрес сайта"
COM_DHARMASITEMAP_FIELD_BASE_URL_DESC="Необязательно. Используйте корневой HTTPS-адрес сайта без пути и параметров. Пустое значение использует основной адрес Joomla."
COM_DHARMASITEMAP_FIELD_TRACKING="Параметры для удаления"
COM_DHARMASITEMAP_FIELD_TRACKING_DESC="Параметры, не меняющие содержимое страницы, будут исключены из URL. Разделяйте запятыми или пробелами. Параметры маршрутизации Joomla не удаляются автоматически."
COM_DHARMASITEMAP_FIELD_PART_SIZE="URL в одном файле"
COM_DHARMASITEMAP_FIELD_PART_SIZE_DESC="Количество адресов в части карты. Допустимый диапазон: от 1 000 до 50 000."
COM_DHARMASITEMAP_FIELD_INCLUDE_CONTENT="Материалы и категории Joomla"
COM_DHARMASITEMAP_FIELD_INCLUDE_CONTACTS="Контакты Joomla"
COM_DHARMASITEMAP_FIELD_INCLUDE_NEWSFEEDS="Ленты новостей Joomla"
COM_DHARMASITEMAP_FIELD_INCLUDE_TAGS="Метки Joomla"
COM_DHARMASITEMAP_FIELD_INCLUDE_DHARMASHOP_PRODUCTS="Товары Dharma Shop"
COM_DHARMASITEMAP_FIELD_INCLUDE_DHARMASHOP_CATEGORIES="Категории Dharma Shop"
COM_DHARMASITEMAP_SETTINGS="Настройки карты"
COM_DHARMASITEMAP_TAB_OVERVIEW="Обзор"
COM_DHARMASITEMAP_TAB_AUTOMATION="Автоматизация"
COM_DHARMASITEMAP_TAB_PERMISSIONS="Права доступа"
COM_DHARMASITEMAP_SCHEDULER="Расписание генерации"
COM_DHARMASITEMAP_XML_ENDPOINT="Резервный Joomla endpoint"
COM_DHARMASITEMAP_CONFIG_GENERAL="Общие настройки"
COM_DHARMASITEMAP_CONFIG_SOURCES="Источники URL"
COM_DHARMASITEMAP_CONFIG_EXCLUSIONS="Исключения"
COM_DHARMASITEMAP_SETTINGS_GENERAL_DESC="Здесь задаются основной домен в sitemap, очистка рекламных параметров и ограничение размера файлов."
COM_DHARMASITEMAP_SETTINGS_SOURCES_DESC="Отключите источник, если его страницы не должны индексироваться. Плагины могут добавлять собственные источники отдельными настройками."
COM_DHARMASITEMAP_SETTINGS_EXCLUSIONS_DESC="Фильтры применяются после проверки публикации и публичного доступа. Исключение по пути влияет на все источники."
COM_DHARMASITEMAP_AUTOMATION_DESC="Расписание хранится в штатных задачах Joomla. Создайте задачу Dharma Sitemap и задайте нужную периодичность; она использует сохранённые настройки источников и фильтров."
COM_DHARMASITEMAP_CLI_TITLE="Командная строка"
COM_DHARMASITEMAP_CLI_DESC="Включите плагин Dharma Sitemap — CLI в менеджере плагинов, затем запускайте команду из корня Joomla."
COM_DHARMASITEMAP_PLUGINS="Открыть плагины Joomla"
COM_DHARMASITEMAP_PERMISSIONS_DESC="Права задаются стандартной матрицей Joomla для компонента. Доступ к изменению этой матрицы есть только у пользователей с правом управления настройками компонента."
COM_DHARMASITEMAP_SETTINGS_ACCESS_DENIED="У вашей учётной записи нет права изменять настройки этого компонента. Попросите администратора Joomla выдать право «Настройки компонента»."
COM_DHARMASITEMAP_FIELD_EXCLUDE_URLS="Исключённые пути URL"
COM_DHARMASITEMAP_FIELD_EXCLUDE_URLS_DESC="По одному шаблону пути на строку. Поддерживаются * и ?. Например: /search/* или /dharma-shop/tovar-ne-dlya-indeksacii. Шаблон применяется к пути, без домена и query-параметров."
COM_DHARMASITEMAP_FIELD_EXCLUDE_ENTITIES="Исключённые сущности"
COM_DHARMASITEMAP_FIELD_EXCLUDE_ENTITIES_DESC="По одному ключу на строку в формате provider:id. Примеры: joomla.content:123, dharmashop.products:456. Публичный доступ и статус публикации всё равно проверяются отдельно."
COM_DHARMASITEMAP_STATIC_FILE_NOTE="Компонент публикует физический sitemap.xml в корне сайта. Существующий чужой файл не перезаписывается."
COM_DHARMASITEMAP_XML_DESCRIPTION="Генератор расширяемой XML-карты сайта для Joomla и Dharma Shop."
COM_DHARMASITEMAP_FIELD_RESPECT_NOINDEX="Не добавлять страницы с noindex"
COM_DHARMASITEMAP_FIELD_RESPECT_NOINDEX_DESC="Страница, закрытая от индексации (robots: noindex), в карту не попадает. Значение берётся так же, как при показе страницы: настройки записи, затем пункт меню, затем общие настройки (для Dharma Shop — настройки магазина). Число исключённых страниц видно в отчёте сборки."
COM_DHARMASITEMAP_FIELD_KEEP_BUILDS="Хранить сборок"
COM_DHARMASITEMAP_FIELD_KEEP_BUILDS_DESC="Сколько последних успешных сборок оставлять (включая активную). Остальные удаляются вместе со строками в базе и файлами частей в корне сайта."
COM_DHARMASITEMAP_FIELD_INCLUDE_DHARMASHOP_BRANDS="Бренды Dharma Shop"
COM_DHARMASITEMAP_FIELD_INCLUDE_DHARMASHOP_BADGES="Бейджи («метки») Dharma Shop"
COM_DHARMASITEMAP_FIELD_INCLUDE_DHARMASHOP_LANDINGS="Посадочные страницы Dharma Shop"
COM_DHARMASITEMAP_FIELD_INCLUDE_MENU="Страницы из меню"
COM_DHARMASITEMAP_FIELD_INCLUDE_MENU_DESC="Главная, списки категорий, брендов, бейджей и посадочных, избранные материалы и другие пункты меню, которых нет у источников сущностей. Корзина, оформление заказа, избранное, заказы, вход, регистрация и поиск не добавляются никогда."
COM_DHARMASITEMAP_FIELD_SKIP_EMPTY="Пропускать пустые категории"
COM_DHARMASITEMAP_FIELD_SKIP_EMPTY_DESC="Категории, бренды и бейджи без опубликованных товаров или материалов (с учётом вложенных) в карту не попадают."
COM_DHARMASITEMAP_REPORT="Что вошло в карту"
COM_DHARMASITEMAP_REPORT_SOURCE="Источник"
COM_DHARMASITEMAP_REPORT_COUNT="Адресов"
COM_DHARMASITEMAP_REPORT_EXCLUDED="Исключено"
COM_DHARMASITEMAP_REPORT_UNAVAILABLE="недоступен"
COM_DHARMASITEMAP_REASON_NOINDEX="noindex"
COM_DHARMASITEMAP_REASON_PATTERN="по настройкам исключений"
COM_DHARMASITEMAP_REASON_NONLOCAL="чужой домен"
COM_DHARMASITEMAP_REASON_INVALID="некорректный адрес"
COM_DHARMASITEMAP_REASON_DUPLICATE="повторы"
COM_DHARMASITEMAP_NOINDEX_WARNING="Из карты исключено страниц с noindex: %s. Если это неожиданно, проверьте robots в общих настройках Joomla (Система → Общие настройки → Метаданные) и в настройках страниц."
COM_DHARMASITEMAP_ROBOTS_TXT_HINT="Добавьте в robots.txt строку: Sitemap: %s"
COM_DHARMASITEMAP_CONFIG_LLMS="llms.txt"
COM_DHARMASITEMAP_SETTINGS_LLMS_DESC="Файл llms.txt — краткий путеводитель по сайту для языковых моделей и поисковых помощников: название, описание и списки ссылок по разделам. Он собирается вместе с картой сайта из тех же страниц, поэтому закрытые, неопубликованные страницы и исключённые адреса в него не попадают."
COM_DHARMASITEMAP_FIELD_LLMS_ENABLED="Публиковать llms.txt"
COM_DHARMASITEMAP_FIELD_LLMS_ENABLED_DESC="Компонент записывает /llms.txt в корень сайта при каждой сборке. Чужой файл с таким именем не перезаписывается."
COM_DHARMASITEMAP_FIELD_LLMS_TITLE="Название сайта"
COM_DHARMASITEMAP_FIELD_LLMS_TITLE_DESC="Первая строка файла. Пусто — название сайта из общих настроек Joomla."
COM_DHARMASITEMAP_FIELD_LLMS_SUMMARY="Краткое описание"
COM_DHARMASITEMAP_FIELD_LLMS_SUMMARY_DESC="Одно-два предложения: чем занимается сайт и для кого он. Выводится цитатой под названием."
COM_DHARMASITEMAP_FIELD_LLMS_DETAILS="Дополнительный текст"
COM_DHARMASITEMAP_FIELD_LLMS_DETAILS_DESC="Необязательно. Абзацы Markdown перед списками ссылок: например, как пользоваться разделами или на что обратить внимание."
COM_DHARMASITEMAP_FIELD_LLMS_RENAME="Переименовать разделы"
COM_DHARMASITEMAP_FIELD_LLMS_RENAME_DESC="По строке: «название на сайте=название в llms.txt». Разделы по умолчанию — названия категорий материалов, «Разделы сайта» для самих категорий и «Страницы» для пунктов меню."
COM_DHARMASITEMAP_FIELD_LLMS_ORDER="Порядок разделов"
COM_DHARMASITEMAP_FIELD_LLMS_ORDER_DESC="По строке: названия разделов (после переименования) в нужном порядке. Остальные идут следом в порядке появления."
COM_DHARMASITEMAP_FIELD_LLMS_MAX="Максимум ссылок"
COM_DHARMASITEMAP_FIELD_LLMS_MAX_DESC="Файл должен оставаться коротким. Лишние ссылки в конце списка отбрасываются."
COM_DHARMASITEMAP_FIELD_LLMS_EXCLUDE="Исключить из llms.txt"
COM_DHARMASITEMAP_FIELD_LLMS_EXCLUDE_DESC="По одному шаблону пути на строку (как в исключениях карты): страницы останутся в sitemap.xml, но не попадут в llms.txt."
COM_DHARMASITEMAP_LLMS_REPORT="llms.txt"
COM_DHARMASITEMAP_LLMS_STATUS_OK="опубликован, ссылок: %s"
COM_DHARMASITEMAP_LLMS_STATUS_OFF="выключен в настройках"
COM_DHARMASITEMAP_LLMS_STATUS_ERROR="не опубликован: %s"
COM_DHARMASITEMAP_LLMS_WARNING="Карта опубликована, но llms.txt не создан: %s"
