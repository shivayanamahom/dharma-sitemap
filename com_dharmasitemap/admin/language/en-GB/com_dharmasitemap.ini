COM_DHARMASITEMAP_SETTINGS_GENERAL_DESC="Set the primary sitemap domain, tracking parameter cleanup, and file size limit here."
COM_DHARMASITEMAP_SETTINGS_SOURCES_DESC="Disable a source if its pages should not be indexed. Plugins can add their own sources with separate settings."
COM_DHARMASITEMAP_SETTINGS_EXCLUSIONS_DESC="Filters run after publication and public access checks. A path exclusion applies to all sources."
COM_DHARMASITEMAP_AUTOMATION_DESC="Scheduling is handled by Joomla's built-in tasks. Create a Dharma Sitemap task and choose its interval; it uses the saved source and filter settings."
COM_DHARMASITEMAP_CLI_TITLE="Command line"
COM_DHARMASITEMAP_CLI_DESC="Enable the Dharma Sitemap — CLI plugin, then run the command from the Joomla root directory."
COM_DHARMASITEMAP_PLUGINS="Open Joomla plugins"
COM_DHARMASITEMAP_PERMISSIONS_DESC="Permissions use Joomla's standard component access rules. Only users who can manage component options can change this matrix."
COM_DHARMASITEMAP_SETTINGS_ACCESS_DENIED="Your account cannot change this component's settings. Ask a Joomla administrator to grant the component options permission."
COM_DHARMASITEMAP_FIELD_EXCLUDE_URLS="Excluded URL paths"
COM_DHARMASITEMAP_FIELD_EXCLUDE_URLS_DESC="One path pattern per line. Supports * and ?. For example: /search/* or /dharma-shop/product-not-for-indexing. Matches the path, without domain or query parameters."
COM_DHARMASITEMAP_FIELD_EXCLUDE_ENTITIES="Excluded entities"
COM_DHARMASITEMAP_FIELD_EXCLUDE_ENTITIES_DESC="One key per line in provider:id format. Examples: joomla.content:123, dharmashop.products:456. Public access and publication status are still enforced."
COM_DHARMASITEMAP_STATIC_FILE_NOTE="The component publishes a physical sitemap.xml file in the site root. An existing file not owned by this component is never overwritten."
COM_DHARMASITEMAP_XML_DESCRIPTION="Extensible XML sitemap generator for Joomla and Dharma Shop."
COM_DHARMASITEMAP_FIELD_RESPECT_NOINDEX="Skip pages with noindex"
COM_DHARMASITEMAP_FIELD_RESPECT_NOINDEX_DESC="A page closed to indexing (robots: noindex) is left out of the sitemap. The value is resolved the way the page itself does it: record settings, then the menu item, then the global settings (the shop settings for Dharma Shop). The number of skipped pages is shown in the build report."
COM_DHARMASITEMAP_FIELD_KEEP_BUILDS="Builds to keep"
COM_DHARMASITEMAP_FIELD_KEEP_BUILDS_DESC="How many of the latest successful builds to keep (including the active one). Older ones are removed together with their database rows and part files in the site root."
COM_DHARMASITEMAP_FIELD_INCLUDE_DHARMASHOP_BRANDS="Dharma Shop brands"
COM_DHARMASITEMAP_FIELD_INCLUDE_DHARMASHOP_BADGES="Dharma Shop badges (labels)"
COM_DHARMASITEMAP_FIELD_INCLUDE_DHARMASHOP_LANDINGS="Dharma Shop landing pages"
COM_DHARMASITEMAP_FIELD_INCLUDE_MENU="Pages from the menu"
COM_DHARMASITEMAP_FIELD_INCLUDE_MENU_DESC="The home page, category, brand, badge and landing lists, featured articles and other menu items that have no entity source. The cart, checkout, favorites, orders, login, registration and search are never added."
COM_DHARMASITEMAP_FIELD_SKIP_EMPTY="Skip empty categories"
COM_DHARMASITEMAP_FIELD_SKIP_EMPTY_DESC="Categories, brands and badges without published products or articles (nested ones included) are left out."
